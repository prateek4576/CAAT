<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz App</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =========================================
           GLOBAL & BASE STYLES
           ========================================= */
      :root {
        --primary-color: #6366f1;
        --primary-hover: #4f46e5;
        --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
        --surface: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --radius: 16px;
        --shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      h1,
      h2,
      h3 {
        font-family: "Fredoka One", cursive;
        font-weight: 400;
        letter-spacing: 0.5px;
      }

      body {
        font-family: "Fredoka One", cursive;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-gradient);
        color: var(--text-main);
      }

      .container {
        background: var(--surface);
        padding: 60px 40px;
        width: 100%;
        max-width: 450px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        text-align: center;
        box-sizing: border-box;
        /* border: 2px solid black; */
        transition: height 0.3s ease;
        margin: 20px;
      }

      /* Typography Improvements */
      h1 {
        font-size: 2.2rem;
        margin-top: 0;
        margin-bottom: 0.7rem;
        color: var(--text-main);
        font-weight: 800;
      }

      h2 {
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 1rem;
        color: var(--primary-color);
        font-weight: 700;
      }

      h3 {
        font-size: 1.2rem;
        margin-bottom: 1.5rem;
        color: var(--text-main);
        font-weight: 500;
        line-height: 1.5;
      }

      p {
        font-size: 1.1rem;
        margin: 12px 0;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* Modern Button Styling */
      button {
        margin: 15px 5px;
        padding: 15px 24px;
        background: blue;
        border-radius: 50px;
        color: white;
        border: none;
        /* border-radius: 8px; */
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
      }

      button:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 8px -1px rgba(99, 102, 241, 0.3);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 4px -1px rgba(99, 102, 241, 0.2);
      }

      /* Option/Answer Styling */
      .option {
        display: flex;
        align-items: center;
        margin: 12px 0;
        padding: 16px;
        background: #f8fafc;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .option:hover {
        border-color: var(--primary-color);
        background: #eef2ff;
      }

      .option input[type="radio"] {
        margin-right: 15px;
        transform: scale(1.3);
        accent-color: var(--primary-color);
        cursor: pointer;
      }

      /* Inputs */
      input[type="text"] {
        width: 90%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        font-size: 1rem;
      }

      /* Screen Transition Animation */
      #start-screen,
      #quiz-screen,
      #section-complete,
      #result-screen {
        animation: fadeIn 0.4s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #quiz-screen h2 {
        color: blue;
      }

      #start-screen h1 {
        /* color: blue; */
        margin-bottom: 40px;
      }

      /* =========================================
   CAAT SCORECARD
   ========================================= */

      body:has(#result-screen:not([style*="none"])) .container {
        max-width: 950px;
        padding: 30px;
      }

      /* Main scorecard */
      #result-screen {
        background: #ffffff;
        padding: 30px;
        border-radius: 22px;
        border: 2px solid #e2e8f0;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);

        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      /* Scorecard title */
      #result-screen > h2 {
        text-align: center;
        font-size: 2.2rem;
        margin: 0 0 25px;
        color: #1e293b;
      }

      /* Student information */
      #student-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f8fafc;
        padding: 16px;
        border-radius: 15px;
        border: 1px solid #e2e8f0;
        margin-bottom: 18px;
      }

      #student-info p {
        background: white;
        padding: 11px;
        margin: 0;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        color: #4f46e5;
        font-weight: 700;
        text-align: center;
      }

      /* Subject score rows */
      .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 14px 18px;
        margin: 10px 0;

        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;

        transition: 0.2s ease;
      }

      .result-row:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(15, 23, 42, 0.08);
      }

      .result-row span:first-child {
        font-weight: 700;
      }

      .result-row span:last-child {
        font-weight: 800;
        color: #1e293b;
      }

      /* Subject colors */
      .math {
        color: #f59e0b;
      }

      .science {
        color: #10b981;
      }

      .aptitude {
        color: #8b5cf6;
      }

      /* Total score */
      #result-screen h3#totalScore {
        margin: 22px 0 18px;
        padding-top: 20px;
        border-top: 2px dashed #cbd5e1;

        text-align: center;
        color: #4f46e5;
        font-size: 2rem;
        font-weight: 800;
      }

      /* Analysis section */
      #analysis {
        background: #f8fafc;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        margin-top: 20px;
      }

      #analysis > h3 {
        text-align: center;
        margin: 0 0 15px;
        color: #1e293b;
        font-size: 1.4rem;
      }

      #analysis p {
        background: white;
        padding: 12px 14px;
        margin: 8px 0;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        font-size: 0.95rem;
        color: #334155;
      }

      /* Overall feedback */
      #overallFeedback {
        margin: 18px 0 10px;
        text-align: center;
        color: #4f46e5;
        font-size: 1.2rem;
        font-weight: 800;
      }

      /* Career section */
      #career-section {
        margin-top: 15px;
        background: #eef2ff;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #c7d2fe;
      }

      #career-section h3 {
        margin: 5px 0 8px;
        color: #4f46e5;
        font-size: 1.05rem;
      }

      #career-section p {
        background: white;
        padding: 10px;
        border-radius: 8px;
        margin: 6px 0;
        border: 1px solid #e2e8f0;
        color: #334155;
        font-size: 0.9rem;
      }

      /* Home button area */
      #result-screen > div:last-child {
        text-align: center;
        margin-top: 25px !important;
      }

      #result-screen > div:last-child button {
        min-width: 120px;
      }

      #result-screen {
        display: block;
      }

      .result-card {
        display: block;
      }

      #student-info {
        width: 100%;
      }

      .result-row {
        width: 100%;
      }

      #analysis {
        width: 100%;
      }
      label {
        display: block;
        text-align: left;
        margin: 10px 0 10px 0; /* top, right, bottom, left */
      }

      input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        font-size: 1rem;
        /* margin: 0; remove extra spacing */
      }

      .form-group {
        text-align: left;
        margin-bottom: 15px;
        margin-right: 30px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
      }

      .form-group input {
        width: 100%;
      }

      .math {
        color: #f59e0b;
      }
      .science {
        color: #10b981;
      }
      .aptitude {
        color: #8b5cf6;
      }

      /* DARK MODE BASE */
      .dark {
        background: #0f172a;
        color: #e2e8f0;
      }

      /* CONTAINER */
      .dark .container {
        background: transparent;
      }

      /* TEXT */
      .dark h1,
      .dark h2,
      .dark h3 {
        color: #f1f5f9;
      }

      .dark p {
        color: black;
      }
      /* INPUTS */
      .dark input {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
      }

      /* OPTIONS (if buttons/divs inside #options) */
      .dark #options div,
      .dark #options button {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
      }

      /* BUTTONS */
      .dark button {
        background: #334155;
        color: white;
      }

      .dark button:hover {
        background: #475569;
      }

      /* RESULT BOX */
      .dark #result-screen {
        background: transparent;
      }

      /* LABEL COLORS (optional glow look) */
      .dark .label.math {
        color: #38bdf8;
      }

      .dark .label.science {
        color: #22c55e;
      }

      .dark .label.aptitude {
        color: #facc15;
      }

      /* ANALYSIS */
      .dark #analysis {
        color: #cbd5f5;
      }

      /* =========================================
   DARK MODE SCORECARD
   ========================================= */

      .dark #result-screen {
        background: #111827;
        border: 2px solid #334155;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      }

      .dark #result-screen > h2 {
        color: #f1f5f9;
      }

      .dark #student-info {
        background: #0f172a;
        border-color: #334155;
      }

      .dark #student-info p {
        background: #1e293b;
        border-color: #334155;
        color: #60a5fa;
      }

      .dark .result-row {
        background: #1e293b;
        border-color: #334155;
      }

      .dark .result-row span:last-child {
        color: #f1f5f9;
      }

      .dark #result-screen h3#totalScore {
        color: #818cf8;
        border-top-color: #475569;
      }

      .dark #analysis {
        background: #0f172a;
        border-color: #334155;
      }

      .dark #analysis > h3 {
        color: #f1f5f9;
      }

      .dark #analysis p {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      .dark #overallFeedback {
        color: #818cf8;
      }

      .dark #career-section {
        background: #172554;
        border-color: #3730a3;
      }

      .dark #career-section h3 {
        color: #93c5fd;
      }

      .dark #career-section p {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      @media (max-width: 700px) {
        body:has(#result-screen:not([style*="none"])) .container {
          padding: 20px 12px;
        }

        #result-screen {
          padding: 20px 15px;
          border-radius: 16px;
        }

        #result-screen > h2 {
          font-size: 1.7rem;
        }

        #student-info {
          grid-template-columns: 1fr;
        }

        .result-row {
          padding: 12px 14px;
          font-size: 14px;
        }

        #result-screen h3#totalScore {
          font-size: 1.6rem;
        }

        #analysis {
          padding: 15px;
        }

        #analysis > h3 {
          font-size: 1.2rem;
        }

        #career-section {
          padding: 12px;
        }
      }

      /* =========================================
   FINAL SCORECARD ALIGNMENT
   ========================================= */

      body:has(#result-screen:not([style*="none"])) {
        align-items: flex-start;
        padding: 30px 20px;
      }

      /* Outer container */
      body:has(#result-screen:not([style*="none"])) .container {
        width: 100%;
        max-width: 950px;
        margin: 0 auto;
        padding: 20px;
        background: transparent;
        box-shadow: none;
      }

      /* Scorecard */
      #result-screen {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;

        padding: 28px;
        box-sizing: border-box;

        border-radius: 20px;
        border: 2px solid #334155;
        background: #111827;

        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      }

      /* Scorecard title */
      #result-screen > h2 {
        width: 100%;
        margin: 0 0 22px;
        text-align: center;
        font-size: 2rem;
        color: #f8fafc;
      }

      /* Name + Class */
      #student-info {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;

        padding: 12px;
        margin: 0 0 14px;

        box-sizing: border-box;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
      }

      #student-info p {
        width: 100%;
        box-sizing: border-box;

        margin: 0;
        padding: 10px;

        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 8px;

        text-align: center;
        color: #93c5fd;
      }

      /* Subject rows */
      .result-row {
        width: 100%;
        box-sizing: border-box;

        display: flex;
        justify-content: space-between;
        align-items: center;

        margin: 6px 0;
        padding: 12px 16px;

        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
      }

      .result-row span:first-child {
        text-align: left;
        font-weight: 700;
      }

      .result-row span:last-child {
        text-align: right;
        font-weight: 800;
        color: #f8fafc;
      }

      /* Total */
      #result-screen h3#totalScore {
        width: 100%;
        box-sizing: border-box;

        margin: 18px 0;
        padding-top: 18px;

        border-top: 2px dashed #475569;

        text-align: center;
        color: #818cf8;
        font-size: 1.8rem;
      }

      /* Analysis */
      #analysis {
        width: 100%;
        box-sizing: border-box;

        margin: 0;
        padding: 18px;

        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;

        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      /* Analysis heading */
      #analysis > h3 {
        width: 100%;
        margin: 0 0 12px;

        text-align: center;
        color: #f1f5f9;
        font-size: 1.25rem;
      }

      /* Analysis messages */
      #analysis p {
        width: 100%;
        box-sizing: border-box;

        margin: 5px 0;
        padding: 10px 12px;

        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;

        text-align: center;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      /* Overall feedback */
      #overallFeedback {
        width: 100%;
        margin: 14px 0;
        text-align: center;
        color: #818cf8;
        font-weight: 800;
      }

      /* Suggestions */
      #career-section {
        width: 100%;
        box-sizing: border-box;

        margin: 10px 0 0;
        padding: 14px;

        background: #172554;
        border: 1px solid #3730a3;
        border-radius: 10px;
      }

      #career-section h3 {
        width: 100%;
        margin: 5px 0 8px;

        text-align: center;
        color: #93c5fd;
        font-size: 1rem;
      }

      #career-section p {
        width: 100%;
        box-sizing: border-box;

        margin: 5px 0;
        padding: 9px;

        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 7px;

        text-align: center;
        color: #cbd5e1;
      }

      /* Home button */
      #result-screen > div:last-child {
        width: 100%;
        margin-top: 22px !important;
        text-align: center;
      }

      #result-screen > div:last-child button {
        min-width: 120px;
      }

      /* Mobile */
      @media (max-width: 700px) {
        body:has(#result-screen:not([style*="none"])) {
          padding: 15px 10px;
        }

        body:has(#result-screen:not([style*="none"])) .container {
          padding: 10px;
        }

        #result-screen {
          padding: 18px 14px;
          border-radius: 16px;
        }

        #result-screen > h2 {
          font-size: 1.6rem;
        }

        #student-info {
          grid-template-columns: 1fr;
        }

        .result-row {
          padding: 11px 12px;
          font-size: 14px;
        }

        #result-screen h3#totalScore {
          font-size: 1.5rem;
        }

        #analysis {
          padding: 14px;
        }
      }

/* =========================================
   FINAL QUIZ UI
   ========================================= */

body:has(#quiz-screen:not([style*="none"])) .container {
  max-width: 700px;
  padding: 40px;
  border: 2px solid #334155;
  border-radius: 20px;
  box-sizing: border-box;
}

/* Quiz screen */
#quiz-screen {
  width: 100%;
  box-sizing: border-box;
  text-align: center;
  padding: 0;
}

/* Section title */
#quiz-screen h2#section-title {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  margin: 0 0 12px;
  padding: 9px 18px;

  border-radius: 50px;

  background: #1e1b4b;
  border: 1px solid #4f46e5;

  color: #a5b4fc;
  font-size: 1.5rem;
}

/* Question counter */
#question-progress {
  display: inline-block;

  margin: 0 0 18px;
  padding: 6px 12px;

  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 20px;

  color: #94a3b8;
  font-size: 0.85rem;
  font-weight: 700;
}

/* Question */
#quiz-screen h3#question {
  margin: 5px 0 25px;

  color: #f1f5f9;
  font-size: 1.45rem;
  line-height: 1.5;
}

/* Options */
#quiz-screen #options {
  width: 100%;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Option card */
#quiz-screen .option {
  width: 100%;
  max-width: 100%;

  box-sizing: border-box;

  display: flex;
  align-items: center;

  min-height: 62px;

  margin: 0;
  padding: 14px 18px;

  background: #1e293b;
  border: 2px solid #475569;
  border-radius: 14px;

  color: #f1f5f9;

  font-size: 1.05rem;
  font-weight: 600;

  text-align: left;

  cursor: pointer;
  transition: 0.2s ease;
}

/* Hover */
#quiz-screen .option:hover {
  border-color: #818cf8;
  background: #263449;
  transform: translateY(-2px);
}

/* Selected */
#quiz-screen .option:has(input:checked) {
  background: #1e1b4b;
  border-color: #818cf8;
  box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.15);
}

/* Radio button */
#quiz-screen .option input[type="radio"] {
  width: 20px;
  height: 20px;

  flex: 0 0 20px;

  margin: 0 15px 0 0;

  padding: 0;

  transform: none;

  accent-color: #818cf8;
}

/* Option text */
#quiz-screen .option span {
  min-width: 0;
  flex: 1;
}

/* Buttons */
.quiz-buttons {
  width: 100%;
  box-sizing: border-box;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 15px;
  margin-top: 28px;
}

.quiz-buttons button {
  min-width: 125px;

  margin: 0;
  padding: 13px 22px;

  border: none;
  border-radius: 50px;

  font-size: 1rem;
  font-weight: 700;
}

.quiz-buttons .prev-btn {
  background: #334155;
  color: white;
}

.quiz-buttons .next-btn {
  background: #6366f1;
  color: white;
}

.quiz-buttons .prev-btn:hover {
  background: #475569;
}

.quiz-buttons .next-btn:hover {
  background: #4f46e5;
}

/* Mobile */
@media (max-width: 600px) {

  body:has(#quiz-screen:not([style*="none"])) .container {
    width: calc(100% - 20px);
    max-width: none;
    padding: 25px 15px;
    margin: 10px;
  }

  #quiz-screen h2#section-title {
    font-size: 1.25rem;
    padding: 8px 14px;
  }

  #quiz-screen h3#question {
    font-size: 1.15rem;
  }

  #quiz-screen .option {
    min-height: 55px;
    padding: 12px 14px;
    font-size: 0.95rem;
  }

  .quiz-buttons {
    gap: 10px;
  }

  .quiz-buttons button {
    min-width: 110px;
    padding: 12px 16px;
  }
}

/* =========================================
   SECTION COMPLETE - CENTER ALIGNMENT
   ========================================= */

/* =========================================
   SECTION COMPLETE - TRUE CENTER
   ========================================= */

body:has(#section-complete:not([style*="none"])) .container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  min-height: 430px;
  box-sizing: border-box;
}

#section-complete {

          <p id="aptitudeFeedback"></p>
